schema_version = 1
# ------------------------------------------------------------------------------
# Routing IDs must be distinct; model is the provider's actual model ID.
# Requires the target-model-aliases patch applied by this repository's Dockerfile.
[llm_clients.fireworks]
format = "openai_responses"
base_url = "https://api.fireworks.ai/inference/v1"
api_key_env = "FIREWORKS_API_KEY"
extra_headers = { x-multi-turn-session-id = "agent_4201kws76rm3fgescz3cst711jp4", x-session-affinity = "agent_4201kws76rm3fgescz3cst711jp4" }

[targets.weak]
id = "fireworks-weak"
model = "accounts/fireworks/routers/glm-5p3-fast"
llm_client = "fireworks"
extra_body = { reasoning = { effort = "low" }, truncation = "auto", reasoning_history = "disabled" }

[targets.strong]
id = "fireworks-strong"
model = "accounts/fireworks/routers/glm-5p3-fast"
llm_client = "fireworks"
extra_body = { reasoning = { effort = "high" }, truncation = "auto", reasoning_history = "disabled" }

# Reserve maximum reasoning for explicitly selected difficult work or recovery.
[targets.deep_max]
id = "fireworks-deep-max"
model = "accounts/fireworks/routers/glm-5p3-fast"
llm_client = "fireworks"
extra_body = { reasoning = { effort = "max" }, truncation = "auto", reasoning_history = "disabled" }

[targets.cheap]
id = "fireworks-cheap"
model = "accounts/fireworks/models/nemotron-lightning-3p5-30b-a3b"
llm_client = "fireworks"

# ------------------------------------------------------------------------------
[routes.stage]
id = "daedalus"
type = "stage_router"
capable_target = "strong"
efficient_target = "weak"
picker = "capable_first"
confidence_threshold = 0.5
recent_turn_window = 3
tool_calling = true
reasoning = false

# Select this route for briefings, recaps, research, and diagnosis from the start.
# Skill-based selection belongs to the caller; stage routing uses tool signals.
[routes.deep]
id = "daedalus/deep"
type = "passthrough"
target = "strong"
tool_calling = true
reasoning = false

[routes.deep_max]
id = "daedalus/max"
type = "passthrough"
target = "deep_max"
tool_calling = true
reasoning = false

[routes.cheap]
id = "daedalus/cheap"
type = "passthrough"
target = "cheap"
tool_calling = true
reasoning = false
