[targets.strong]
id = "Qwen/Qwen3.8-27B-FP8"
llm_client = "strong"
extra_body = { reasoning = { effort = "xhigh" }, chat_template_kwargs = { preserve_thinking = false }, temperature = 1.0, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, repetition_penalty = 1.0 }

# ------------------------------------------------------------------------------
[llm_clients.weak]
format = "openai_responses"
base_url = "http://qwen36-27b-vllm-agg-frontend.daedalus-dynamo.svc.cluster.local:8000/v1"
api_key_env = "LOCAL_API_KEY"

[targets.weak]
id = "Qwen/Qwen3.8-27B-FP8"
llm_client = "weak"
extra_body = { reasoning = { effort = "medium" }, chat_template_kwargs = { preserve_thinking = false }, temperature = 1.0, top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, repetition_penalty = 1.0 }

# ------------------------------------------------------------------------------
[llm_clients.llm_classifier]
format = "openai_chat"
base_url = "http://qwen36-27b-vllm-agg-frontend.daedalus-dynamo.svc.cluster.local:8000/v1"
api_key_env = "LOCAL_API_KEY"

[targets.classifier]
id = "Qwen/Qwen3.8-27B-FP8"
llm_client = "llm_classifier"
extra_body = { chat_template_kwargs = { enable_thinking = false }, temperature = 0.7, top_p = 0.80, top_k = 20, min_p = 0.0, presence_penalty = 1.5, repetition_penalty = 1.0 }

# ------------------------------------------------------------------------------
[routes.stage]
id = "switchyard/stage"
type = "llm_classifier"
mode = "capability"
classifier_target = "classifier"
strong_target = "strong"
