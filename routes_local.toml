schema_version = 1
# ------------------------------------------------------------------------------
[llm_clients.local]
format = "openai_responses"
base_url = "http://inference-gateway.daedalus-dynamo.svc.cluster.local:32359/v1"
api_key_env = "LOCAL_API_KEY"

[targets.strong]
id = "strong"
model = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
llm_client = "local"
extra_body = { temperature = 1.0, top_p = 0.95, reasoning_budget = 16384, chat_template_kwargs = { enable_thinking = true } }

[targets.weak]
id = "weak"
model = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
llm_client = "local"
extra_body = { temperature = 1.0, top_p = 0.95, reasoning_budget = 256, chat_template_kwargs = { enable_thinking = true } }
# ------------------------------------------------------------------------------
[routes.stage]
id = "daedalus"
type = "stage_router"
capable_target = "strong"
efficient_target = "weak"
picker = "efficient_first"
confidence_threshold = 0.5
recent_turn_window = 3
tool_calling = true
reasoning = true
