schema_version = 1

# ------------------------------------------------------------------------------
[llm_clients.strong]
format = "openai_responses"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[targets.strong]
id = "gpt-5.6-luna"
llm_client = "strong"
extra_body = { reasoning = { effort = "xhigh", summary = "concise" }, text = { verbosity = "low" }, store = false }

# ------------------------------------------------------------------------------
[llm_clients.weak]
format = "openai_responses"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[targets.weak]
id = "gpt-5.6-luna"
llm_client = "weak"
extra_body = { reasoning = { effort = "low", summary = "concise" }, text = { verbosity = "low" }, store = false }

# ------------------------------------------------------------------------------
[llm_clients.llm_classifier]
format = "openai_chat"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[targets.classifier]
id = "gpt-5.4-nano"
llm_client = "llm_classifier"
extra_body = { reasoning_effort = "none" }

# ------------------------------------------------------------------------------
[routes.stage]
id = "switchyard/stage"
type = "llm_classifier"
mode = "capability"
classifier_target = "classifier"
strong_target = "strong"
weak_target = "weak"
base_threshold = 0.5
threshold_step = 0.1
recent_turn_window = 3
tool_calling = true
session_affinity = false
message_hash_fallback = false
max_output_tokens = 8024
reasoning = false
