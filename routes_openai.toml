schema_version = 1
# ------------------------------------------------------------------------------
[llm_clients.openai]
format = "openai_responses"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[targets.max]
id = "max"
model = "gpt-6-sol"
llm_client = "openai"
extra_body = { reasoning = { effort = "max", summary = "auto" }, text = { verbosity = "low" }, store = true }

[targets.xhigh]
id = "xhigh"
model = "gpt-6-sol"
llm_client = "openai"
extra_body = { reasoning = { effort = "xhigh", summary = "auto" }, text = { verbosity = "low" }, store = true }

[targets.high]
id = "high"
model = "gpt-6-sol"
llm_client = "openai"
extra_body = { reasoning = { effort = "high", summary = "auto" }, text = { verbosity = "low" }, store = true }

[targets.medium]
id = "medium"
model = "gpt-6-sol"
llm_client = "openai"
extra_body = { reasoning = { effort = "medium", summary = "auto" }, text = { verbosity = "low" }, store = true }

[targets.low]
id = "low"
model = "gpt-6-sol"
llm_client = "openai"
extra_body = { reasoning = { effort = "low", summary = "auto" }, text = { verbosity = "low" }, store = true }

[targets.none]
id = "none"
model = "gpt-6-sol"
llm_client = "openai"
extra_body = { reasoning = { effort = "none", summary = "auto" }, text = { verbosity = "low" }, store = true }
# ------------------------------------------------------------------------------
[llm_clients.local]
format = "openai_responses"
base_url = "http://inference-gateway.daedalus-dynamo.svc.cluster.local:32359/v1"
api_key_env = "LOCAL_API_KEY"

[targets.local]
id = "local"
model = "nvidia/Muse-Glimmer-30B-NVFP4"
llm_client = "local"
# ------------------------------------------------------------------------------
[routes.stage]
id = "daedalus"
type = "stage_router"
capable_target = "high"
efficient_target = "low"
picker = "capable_first"
confidence_threshold = 0.5
recent_turn_window = 3
tool_calling = true
reasoning = true
# ------------------------------------------------------------------------------
[routes.max]
id = "daedalus/max"
type = "passthrough"
target = "max"
tool_calling = true
reasoning = true

[routes.xhigh]
id = "daedalus/xhigh"
type = "passthrough"
target = "xhigh"
tool_calling = true
reasoning = true

[routes.high]
id = "daedalus/high"
type = "passthrough"
target = "high"
tool_calling = true
reasoning = true

[routes.medium]
id = "daedalus/medium"
type = "passthrough"
target = "medium"
tool_calling = true
reasoning = true

[routes.low]
id = "daedalus/low"
type = "passthrough"
target = "low"
tool_calling = true
reasoning = true

[routes.none]
id = "daedalus/none"
type = "passthrough"
target = "none"
tool_calling = true
reasoning = true

[routes.local]
id = "daedalus/local"
type = "passthrough"
target = "local"
tool_calling = true
reasoning = false
