schema_version = 1
# ------------------------------------------------------------------------------
[llm_clients.openai]
format = "openai_responses"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[targets.strong]
id = "gpt-5.6-luna"
llm_client = "openai"
extra_body = { reasoning = { effort = "xhigh", summary = "auto" }, text = { verbosity = "low" }, store = true }

[targets.weak]
id = "gpt-5.6-luna"
llm_client = "openai"
extra_body = { reasoning = { effort = "low", summary = "auto" }, text = { verbosity = "low" }, store = true }
# ------------------------------------------------------------------------------
[routes.stage]
id = "daedalus"
type = "stage_router"
capable_target = "strong"
efficient_target = "weak"
picker = "efficient_first"
confidence_threshold = 0.5
recent_turn_window = 3
tool_calling = true
reasoning = false
