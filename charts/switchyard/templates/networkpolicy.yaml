apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "switchyard.fullname" . }}-consumers
  namespace: {{ .Release.Namespace }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "switchyard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "switchyard.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: daedalus
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hindsight
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- if and .Values.networkPolicy.allowNodePortSNAT (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) }}
{{- if or (ne .Values.service.type "LoadBalancer") (not .Values.service.loadBalancerSourceRanges) (ne (index .Values.service.annotations "service.cilium.io/src-ranges-policy" | default "allow") "allow") }}
{{- fail "Cilium NodePort forwarding requires LoadBalancer source ranges with an allow policy to filter LAN clients before SNAT" }}
{{- end }}
---
# The Service's Cilium source-range filter checks the original LAN source before
# cross-node SNAT. Forwarded external traffic retains world identity even when
# its source IP becomes a node address; host/remote-node and CIDRs do not match it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "switchyard.fullname" . }}-nodeport-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "switchyard.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "switchyard.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEntities: [host, remote-node, world]
      toPorts:
        - ports:
            - port: {{ .Values.service.port | quote }}
              protocol: TCP
    {{- with concat .Values.networkPolicy.allowedExternalCIDRs .Values.networkPolicy.nodeSourceCIDRs }}
    - fromCIDR:
        {{- toYaml . | nindent 8 }}
      toPorts:
        - ports:
            - port: {{ $.Values.service.port | quote }}
              protocol: TCP
    {{- end }}
{{- end }}
