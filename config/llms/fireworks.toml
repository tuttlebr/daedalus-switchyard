# Provider clients and generation targets.
# stream=true enforces SSE for every generation call (including caller stream=false).
[llm_clients.fireworks]
format = "openai_responses"
base_url = "https://api.fireworks.ai/inference/v1"
api_key_env = "FIREWORKS_API_KEY"
extra_headers = { x-multi-turn-session-id = "${GLOBAL_SESSION_ID}", x-session-affinity = "${GLOBAL_SESSION_ID}" }

[targets.max]
id = "max"
model = "accounts/fireworks/models/inkling-2-small"
llm_client = "fireworks"
extra_body = { stream = true, reasoning = { effort = "high" }, reasoning_history = "disabled", context_length_exceeded_behavior = "truncate" }

[targets.high]
id = "high"
model = "accounts/fireworks/models/inkling-2-small"
llm_client = "fireworks"
extra_body = { stream = true, reasoning = { effort = "medium" }, reasoning_history = "disabled", context_length_exceeded_behavior = "truncate" }

[targets.low]
id = "low"
model = "accounts/fireworks/models/inkling-2-small"
llm_client = "fireworks"
extra_body = { stream = true, reasoning = { effort = "low" }, reasoning_history = "disabled", context_length_exceeded_behavior = "truncate" }

# Keep reasoning enabled; instant shares the lightest depth with low.
[targets.instant]
id = "instant"
model = "accounts/fireworks/routers/deepseek-v4p1-flash-1017-ultrafast"
llm_client = "fireworks"
extra_body = { stream = true, reasoning = { effort = "low" }, reasoning_history = "disabled", context_length_exceeded_behavior = "truncate" }
# ------------------------------------------------------------------------------
