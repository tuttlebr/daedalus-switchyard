# Provider clients and generation targets.
# stream=true enforces SSE for every generation call (including caller stream=false).
[llm_clients.fireworks]
format = "openai_responses"
base_url = "https://api.fireworks.ai/inference/v1"
api_key_env = "FIREWORKS_API_KEY"
extra_headers = { x-multi-turn-session-id = "${GLOBAL_SESSION_ID}", x-session-affinity = "${GLOBAL_SESSION_ID}" }

[targets.max]
id = "max"
model = "accounts/fireworks/models/deepseek-v4p1-flash-1017"
llm_client = "fireworks"
extra_body = { stream = true, reasoning = { effort = "max" } }

[targets.high]
id = "high"
model = "accounts/fireworks/models/deepseek-v4p1-flash-1017"
llm_client = "fireworks"
extra_body = { stream = true, reasoning = { effort = "high" } }

[targets.low]
id = "low"
model = "accounts/fireworks/models/deepseek-v4p1-flash-1017"
llm_client = "fireworks"
extra_body = { stream = true, reasoning = { effort = "low" } }

# Keep reasoning enabled; instant shares the lightest depth with low.
[targets.instant]
id = "instant"
model = "accounts/fireworks/models/deepseek-v4p1-flash-1017"
llm_client = "fireworks"
extra_body = { stream = true, reasoning = { effort = "low" } }
# ------------------------------------------------------------------------------
