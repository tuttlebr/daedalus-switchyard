# Provider clients and generation targets.
# stream=true enforces SSE for every generation call (including caller stream=false).
[llm_clients.openrouter]
format = "openai_responses"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[targets.max]
id = "max"
model = "deepseek/deepseek-v4.1-flash-1017:nitro"
llm_client = "openrouter"
extra_body = { stream = true, reasoning = { enabled = true, effort = "max" } }

[targets.high]
id = "high"
model = "deepseek/deepseek-v4.1-flash-1017:nitro"
llm_client = "openrouter"
extra_body = { stream = true, reasoning = { enabled = true, effort = "high" } }

[targets.low]
id = "low"
model = "deepseek/deepseek-v4.1-flash-1017:nitro"
llm_client = "openrouter"
extra_body = { stream = true, reasoning = { enabled = true, effort = "low" } }

[targets.instant]
id = "instant"
model = "deepseek/deepseek-v4.1-flash-1017:nitro"
llm_client = "openrouter"
extra_body = { stream = true, reasoning = { enabled = true, effort = "minimal" } }
