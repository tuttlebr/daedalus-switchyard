# Provider clients and generation targets.
# stream=true enforces SSE for every generation call (including caller stream=false).
[llm_clients.openai]
format = "openai_responses"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[targets.max]
id = "max"
model = "gpt-6.2-astra"
llm_client = "openai"
extra_body = { stream = true, text = { verbosity = "low" }, reasoning = { summary = "concise", effort = "low" }, store = false }

[targets.high]
id = "high"
model = "gpt-6.2-sol"
llm_client = "openai"
extra_body = { stream = true, text = { verbosity = "low" }, reasoning = { summary = "concise", effort = "low" }, store = false }

[targets.low]
id = "low"
model = "gpt-6.1-terra"
llm_client = "openai"
extra_body = { stream = true, text = { verbosity = "low" }, reasoning = { summary = "concise", effort = "low" }, store = false }

# Terra does not support minimal; instant keeps reasoning on at low.
[targets.instant]
id = "instant"
model = "gpt-6-luna"
llm_client = "openai"
extra_body = { stream = true, text = { verbosity = "low" }, reasoning = { summary = "concise", effort = "low" }, store = false }
# ------------------------------------------------------------------------------
