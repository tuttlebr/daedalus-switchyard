# Provider clients and generation targets.
# stream=true enforces SSE for every generation call (including caller stream=false).
[llm_clients.baseten]
format = "openai_responses"
base_url = "https://inference.baseten.co/v1"
api_key_env = "BASETEN_API_KEY"
extra_headers = { x-session-affinity = "${GLOBAL_SESSION_ID}" }

[targets.max]
id = "max"
model = "zai-org/GLM-5.3-Fast"
llm_client = "baseten"
extra_body = { stream = true, reasoning = { effort = "high" } }

[targets.high]
id = "high"
model = "zai-org/GLM-5.3-Fast"
llm_client = "baseten"
extra_body = { stream = true, reasoning = { effort = "low" } }

[targets.low]
id = "low"
model = "deepseek-ai/DeepSeek-V4.1-Flash-1017-Fast"
llm_client = "baseten"
extra_body = { stream = true, reasoning = { effort = "high" } }

[targets.instant]
id = "instant"
model = "deepseek-ai/DeepSeek-V4.1-Flash-1017-Fast"
llm_client = "baseten"
extra_body = { stream = true, reasoning = { effort = "low" } }
# ------------------------------------------------------------------------------
