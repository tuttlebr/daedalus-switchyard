# Hosted System One accepts the public slug and reports the backend identifier.
[routes.stage.classifier]
type = "decision_api"
base_url = "https://inference.baseten.co/v1"
model = "decision-models/baseten-bison-latest"
baseten = { response_model = "decision-models/baseten-bison-31b-latest" }
classify_trigger = "user_turn"
timeout_ms = 2000
recent_turn_window = 6
max_input_tokens = 131072
truncate_input = true
max_request_bytes = 65536
api_key_env = "BASETEN_API_KEY"
