schema_version = 1
# ------------------------------------------------------------------------------
[llm_clients.baseten]
format = "openai_chat"
base_url = "https://inference.baseten.co/v1"
api_key_env = "BASETEN_API_KEY"
extra_headers = { x-session-affinity = "${GLOBAL_SESSION_ID}" }

[targets.max]
id = "max"
model = "deepseek-ai/DeepSeek-V4.1-Flash-1017-Fast"
llm_client = "baseten"
extra_body = { reasoning_effort = "max" }

[targets.high]
id = "high"
model = "deepseek-ai/DeepSeek-V4.1-Flash-1017-Fast"
llm_client = "baseten"
extra_body = { reasoning_effort = "high" }

[targets.low]
id = "low"
model = "deepseek-ai/DeepSeek-V4.1-Flash-1017-Fast"
llm_client = "baseten"
extra_body = { reasoning_effort = "medium" }

[targets.instant]
id = "instant"
model = "deepseek-ai/DeepSeek-V4.1-Flash-1017-Fast"
llm_client = "baseten"
extra_body = { reasoning_effort = "low" }
# ------------------------------------------------------------------------------
[routes.stage]
id = "daedalus"
type = "decision_api"
default_target = "high"
tool_calling = true
reasoning = true

[routes.stage.classifier]
type = "decision_api"
base_url = "http://decision-api.daedalus.svc.cluster.local:30000/v1"
model = "auto"
classify_trigger = "every_request"
timeout_ms = 2000
recent_turn_window = 6
max_input_tokens = "auto"
truncate_input = true
max_request_bytes = 65536
instructions = """
Choose the optimal reasoning difficulty for the next model response:
instant, low, high or max

Reassess every request, including tool continuations.
Use the active task, latest user instruction, recent results, available tools,
remaining dependencies and required validation. Judge reasoning difficulty,
not prompt length, output length, tool count or the task's category.

The categories describe work requirements, not public model names. The four
explicit provider profiles are instant, low, high and max. Categories medium,
high and xhigh all select the high provider profile. Provider defaults are
configured separately. Instant is for trivial responses; low for mechanical
work; medium for ordinary bounded agent work; high for difficult investigation;
xhigh for unusually deep synthesis; max for exceptional reasoning or concrete
high-impact risks. A request for speed never reduces required correctness.
"""
uncertain_criteria = """
The intended task or deliverable cannot be identified from the available context,
such as an unexplained reference to a missing earlier task. Do not select this
for a known task merely needing tools, research, permissions or verification.
Uncertain, below-threshold results and classifier failures use default_target
= high. That fallback still uses baseten and grants no additional permissions.
"""

[routes.stage.classifier.choices.instant]
target = "instant"
min_probability = 0.35
criteria = """
Only trivial conversational responses: a greeting, thanks, acknowledgment, or
verbatim repetition of a supplied short string. No substantive task, tool use,
calculation, extraction or verification. If a greeting accompanies a task, judge
the task. Use low for mechanical work and medium for ordinary synthesis.
"""

[routes.stage.classifier.choices.low]
target = "low"
min_probability = 0.45
criteria = """
Mechanical extraction, classification, direct facts, basic arithmetic, exact
text replacement or short predictable tool loops. The procedure and success
criteria are clear and require little inference. Includes returning catalog
fields, applying an already-validated plan or copying a verified result.
Any explanation of code, prose summary, comparison or implementation uses
medium even if short. Low is literal retrieval or transformation only.
"""

[routes.stage.classifier.choices.high]
target = "high"
min_probability = 0.55
criteria = """
Hard debugging, substantial multi-step inference or a long adaptive investigation
where results determine the next actions. Isolate intermittent failures, test
competing hypotheses or reconcile technical inconsistencies with systematic
validation. Routine research and predictable implementation use medium.
Unusually deep synthesis with independent cross-checks uses xhigh.
"""

[routes.stage.classifier.choices.max]
target = "max"
# Winning max choices must also meet this probability gate.
min_probability = 0.65
criteria = """
Exceptional reasoning: rigorous proofs, novel algorithm design, repeated failed
strategies requiring a new approach, or cross-component concurrency and
integrity problems. Also consequential decisions with concrete medical, legal,
financial or production risk, especially irreversible changes or migrations
requiring verification and rollback. A domain label alone is insufficient:
a routine appointment summary or read-only health check is not high-impact.
"""

# ------------------------------------------------------------------------------
[routes.max]
id = "daedalus/max"
type = "passthrough"
target = "max"
tool_calling = true
reasoning = true
vision = true
context_window = 1048576

[routes.high]
id = "daedalus/high"
type = "passthrough"
target = "high"
tool_calling = true
reasoning = true
vision = true
context_window = 1048576

[routes.low]
id = "daedalus/low"
type = "passthrough"
target = "low"
tool_calling = true
reasoning = true
vision = true
context_window = 1048576

[routes.instant]
id = "daedalus/instant"
type = "passthrough"
target = "instant"
tool_calling = true
reasoning = true
vision = true
context_window = 1048576
