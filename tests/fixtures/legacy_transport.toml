# Synthetic legacy algorithm fixture, not a deployment source.
# Six named efforts and local aliases exercise backward-compatible gateway algorithms.
schema_version = 1
[llm_clients.fireworks]
format = "openai_chat"
base_url = "http://fixture-provider.invalid/v1"
api_key_env = "FIREWORKS_API_KEY"
[llm_clients.local]
format = "openai_chat"
base_url = "http://fixture-local.invalid/v1"
api_key_env = "LOCAL_API_KEY"

[targets.max]
id = "max"
model = "synthetic-hosted-model"
llm_client = "fireworks"
extra_body = { reasoning_effort = "max", reasoning_history = "interleaved" }

[targets.xhigh]
id = "xhigh"
model = "synthetic-hosted-model"
llm_client = "fireworks"
extra_body = { reasoning_effort = "xhigh", reasoning_history = "interleaved" }

[targets.high]
