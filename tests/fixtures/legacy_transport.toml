[targets.local]
id = "local"
model = "nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB"
llm_client = "local"
extra_body = { reasoning_effort = "medium", chat_template_kwargs = { enable_thinking = true } }
[targets.hindsight_local]
id = "hindsight_local"
model = "nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB"
llm_client = "local"
extra_body = { chat_template_kwargs = { enable_thinking = false } }
[routes.stage]
id = "daedalus"
type = "decision_api"
# Failure fallback for the synthetic standalone policy.
default_target = "xhigh"
tool_calling = true
reasoning = true
[routes.stage.classifier]
type = "decision_api"
base_url = "http://fixture-judge.invalid/v1"
model = "auto"
classify_trigger = "every_request"
timeout_ms = 2000
recent_turn_window = 6
max_input_tokens = "auto"
truncate_input = true
max_request_bytes = 65536
instructions = "Synthetic legacy classification."
uncertain_criteria = "Unknown task."

[routes.stage.classifier.choices.instant]
target = "instant"
min_probability = 0.90
criteria = "Synthetic instant criteria."

[routes.stage.classifier.choices.low]
target = "low"
min_probability = 0.90
criteria = "Synthetic low criteria."

[routes.stage.classifier.choices.medium]
target = "medium"
min_probability = 0.90
criteria = "Synthetic medium criteria."

[routes.stage.classifier.choices.high]
target = "high"
min_probability = 0.90
criteria = "Synthetic high criteria."

[routes.stage.classifier.choices.xhigh]
target = "xhigh"
min_probability = 0.55
criteria = "Synthetic xhigh criteria."

[routes.stage.classifier.choices.max]
target = "max"
min_probability = 0.00
criteria = "Synthetic max criteria."

[routes.stage.classifier.choices.local]
target = "local"
min_probability = 0.00
criteria = "Synthetic local criteria."

